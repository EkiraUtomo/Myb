<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ZumHub Locker</title>
<style>
:root{--bg:#07070f;--card:#111122;--line:#29213e;--fg:#f3efff;--muted:#9188aa;--accent:#9b70e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,rgba(124,92,191,.18),transparent 36%),var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);padding:32px;border:1px solid var(--line);border-radius:22px;background:rgba(17,17,34,.9);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
.icon{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:rgba(155,112,232,.13);border:1px solid rgba(155,112,232,.25);font-size:25px}
h1{margin:.2rem 0 .7rem;font-size:clamp(1.55rem,5vw,2rem);letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.65;margin:0}.tag{display:inline-block;margin-top:20px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:#aaa0c4;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">⌁</div>
  <h1>Oops. Sorry, skidders — not today!</h1>
  <p class="muted">This link is an execution-only locker. The public page does not display the script, source, loader, or locker contents.</p>
  <span class="tag">protected execution endpoint</span>
</main>
</body>
</html>
