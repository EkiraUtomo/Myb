<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ZumHub Locker</title><style>body{margin:0;min-height:100vh;background:#07070f;color:#f3efff;font:15px system-ui;display:grid;place-items:center;padding:24px}main{max-width:620px;padding:28px;border:1px solid #29213e;border-radius:18px;background:#111122}h1{margin:.2rem 0}.muted{color:#9188aa;line-height:1.6}</style></head><body><main><small>ZUMHUB / LOCKER</small><h1 id="title">Loading…</h1><p class="muted">This is a protected execution endpoint. The permanent execution loader is issued privately through the admin panel; the public /l/ page never exposes the bearer capability.</p><p class="muted" id="status">Checking locker…</p></main><script>const slug=location.pathname.replace(/\/$/,'').split('/').pop().toLowerCase();document.getElementById('title').textContent='/'+slug;fetch('/api/issue?slug='+encodeURIComponent(slug),{cache:'no-store'}).then(r=>r.json()).then(d=>document.getElementById('status').textContent=d.ok?'Locker is active.':'Locker unavailable.').catch(()=>document.getElementById('status').textContent='Locker unavailable.');</script></body></html>
